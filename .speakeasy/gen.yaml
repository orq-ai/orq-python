configVersion: 2.0.0
generation:
  sdkClassName: Orq
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: false
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: false
    sharedErrorComponentsApr2025: false
    sharedNestedComponentsJan2026: false
    nameOverrideFeb2026: false
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: false
    hoistGlobalSecurity: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: ""
  versioningStrategy: automatic
  persistentEdits: {}
  tests:
    generateTests: true
    generateNewTests: false
    skipResponseBodyAssertions: false
python:
  version: 4.14.10
  additionalDependencies:
    dev:
      openai-agents: ==0.4.0
      opentelemetry-api: ^1.20.0
      opentelemetry-instrumentation: ==0.59b0
      opentelemetry-sdk: ^1.20.0
      types-requests: ^2.32.4.20250809
    main:
      requests: '>=2.33.0,<3.0.0'
  allowedRedefinedBuiltins:
    - id
    - object
    - input
  asyncMode: both
  authors:
    - Orq
  baseErrorName: OrqError
  bodyVariantOverloads: false
  clientServerStatusCodesAsErrors: true
  compileCommands:
    - - uv
      - lock
    - - uv
      - run
      - python
      - scripts/prepare_readme.py
    - - uv
      - sync
      - --dev
    - - uv
      - run
      - python
      - scripts/apply_patches.py
    - - uv
      - run
      - python
      - -m
      - compileall
      - -q
      - .
    - - uv
      - run
      - python
      - -m
      - mypy
      - src/orq_ai_sdk
    - - uv
      - run
      - python
      - -m
      - pylint
      - -j=0
      - src/orq_ai_sdk
    - - env
      - NODE_OPTIONS=--max-old-space-size=8192
      - uv
      - run
      - python
      - -m
      - pyright
      - src/orq_ai_sdk
  constFieldCasing: upper
  defaultErrorName: APIDefaultError
  description: Python Client SDK for the Orq API.
  durationFormat: false
  enableCustomCodeRegions: false
  enumFormat: union
  envVarPrefix: ORQ
  errorSchemaValidation: true
  eventStreamClassNames:
    async: EventStreamAsync
    sync: EventStream
  fixFlags:
    asyncPaginationSep2025: false
    conflictResistantModelImportsFeb2026: true
    responseRequiredSep2024: false
  flattenGlobalSecurity: true
  flattenRequests: true
  flatteningOrder: parameters-first
  forwardCompatibleEnumsByDefault: false
  forwardCompatibleUnionsByDefault: "false"
  httpClientLibrary: httpx
  imports:
    option: openapi
    paths:
      callbacks: ""
      errors: ""
      operations: ""
      shared: ""
      webhooks: ""
  inferUnionDiscriminators: true
  inputModelSuffix: input
  inputTypedDictSuffix: TypedDict
  legacyPyright: true
  license: ""
  maxMethodParams: 15
  methodArguments: infer-optional-args
  methodTimeoutArgument: timeout-ms
  methodTimeoutUnits: milliseconds
  moduleName: ""
  multipartArrayFormat: legacy
  optionalDependencies: {}
  outputModelSuffix: output
  packageManager: uv
  packageName: orq-ai-sdk
  preApplyUnionDiscriminators: false
  pytestFilterWarnings: []
  pytestTimeout: 0
  rawResponseHelpers: false
  responseFormat: flat
  responseSchemaValidation: true
  sseFlatResponse: false
  templateVersion: v2
  useAsyncHooks: false
  uuidFormat: false
